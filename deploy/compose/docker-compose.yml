name: flowpilot
services:
  mysql:
    mem_limit: 512m
    image: mysql:8.4
    command: [--log-bin-trust-function-creators=1, --innodb-buffer-pool-size=64M, --performance-schema=OFF, --max-connections=80, --mysqlx=0]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: flowpilot
      MYSQL_USER: flowpilot
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D flowpilot -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  redis:
    mem_limit: 96m
    image: redis:7-alpine
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      retries: 20
    restart: unless-stopped
  backend:
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      FLOWPILOT_AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATA_REDIS_TIMEOUT: ${REDIS_TIMEOUT:-10s}
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-10s}
      DB_URL: jdbc:mysql://mysql:3306/flowpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC
      DB_USERNAME: flowpilot
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_TEAM: ${BOOTSTRAP_TEAM:-team-default}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      LLM_MODE: ${LLM_MODE:-fake}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_ACCOUNT_ID: ${IMAP_ACCOUNT_ID:-}
      IDENTITY_VERIFIER_URL: ${IDENTITY_VERIFIER_URL:-}
      AUTO_ANALYZE_ENABLED: ${AUTO_ANALYZE_ENABLED:-false}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS --max-time 12 http://localhost:8080/actuator/health >/dev/null']
      interval: 15s
      timeout: 15s
      start_period: 60s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    ports: ['127.0.0.1:${WEB_PORT:-18080}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health']
      interval: 10s
      retries: 10
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ['../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro', '../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro']
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
