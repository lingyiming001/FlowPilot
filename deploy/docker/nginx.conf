server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2m;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $flowpilot_backend backend:8080;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ {
   proxy_pass http://$flowpilot_backend;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Host $http_host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Forwarded "";
   proxy_set_header X-Forwarded-Port "";
   proxy_set_header X-Forwarded-Prefix "";
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_buffering off;
   proxy_cache off;
   proxy_read_timeout 65s;
 }
 location /actuator/health { proxy_pass http://$flowpilot_backend; }
 location = /health { access_log off; return 200 'ok'; }
 location / { try_files $uri $uri/ /index.html; }
}
